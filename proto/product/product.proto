syntax = "proto3";

package product;

option go_package = "shop/internal/pb/product" ;

message ProductMetadata {
  string          name        = 1;
  string          slug        = 2 ;
  string          description = 3 ;
  uint64          price       = 4;
  optional uint64 stock       = 5 ;
  uint64          category_id = 6;
  bytes           main_image  = 7;
}

message GalleryImage {
  bytes image = 1;
}

message CreateRequest {
  oneof payload {
    ProductMetadata metadata = 1;
    GalleryImage    image    = 2;
  }
}

message ProductResponse {
  uint64          id          = 1;
  string          name        = 2;
  string          slug        = 3;
  string          description = 4;
  uint64          price       = 5;
  uint64          stock       = 6;
  uint64          category_id = 7;
  string          main_image  = 8;
  repeated string images      = 9;
}

message GetAllRequest {
  int32           page          = 1;
  int32           limit         = 2;
  optional string category_slug = 3;
}

message ProductListItem {
  uint64 id          = 1;
  string name        = 2;
  string slug        = 3;
  uint64 price       = 4;
  uint64 stock       = 5;
  uint64 category_id = 6;
  string main_image  = 7;
}

message PaginationMeta {
  int32 page        = 1;
  int32 limit       = 2;
  int32 total       = 3;
  int32 total_pages = 4;
}

message GetAllResponse {
  repeated ProductListItem products = 1;
  PaginationMeta           meta     = 2;
}

message GetOneBySlugRequest {
  string slug = 1;
}

service ProductService {
  rpc Create(stream CreateRequest) returns (ProductResponse);
  rpc GetAll(GetAllRequest) returns (GetAllResponse);
  rpc GetOneBySlug(GetOneBySlugRequest) returns (ProductResponse);
}